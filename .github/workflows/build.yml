name: Build IPA & Dylib

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# tag 推送时创建 Release 需要 contents: write。
# 默认 GITHUB_TOKEN 只有 Contents: read，softprops/action-gh-release 会 403，
# 表现为「编译全部成功但工作流最终失败」。
permissions:
  contents: write

# 同一 ref 上的多次构建只保留最后一次。
# 教训（v2.4.0）：移动 tag 触发新构建时，若上一次还在跑，两次都会向同名 Release
# 上传同名资产，后结束的覆盖先结束的 —— 曾导致旧源码的 IPA 覆盖新源码 IPA。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ---------------------------------------------------------------------
    # 静态核查放在编译之前。
    # 括号配平 / 原 IMP 判空 / hook 符号配对 / 时长不变量 —— 这些是本项目
    # 历史上反复出现的错误类别，静态阶段就能拦下，比等 clang 报错更快、
    # 报错信息也更直白（clang 对宏展开后的错误定位很差）。
    # ---------------------------------------------------------------------
    - name: Static source check
      run: |
        set -e
        python3 tools/static_check.py .
        python3 tools/check_v300.py .
        python3 tools/check_symbols.py .
        python3 tools/check_config_keys.py .
        echo "--- 帧对齐算法验证:"
        python3 tools/test_frame_align.py
        echo "--- 疯狂加速效果校验:"
        python3 tools/verify_accel_effect.py

    - name: Install ldid
      run: brew install ldid

    # ---------------------------------------------------------------------
    # 构建 dylib。
    # 与 v2.x 相比，这里从「编译一个 4772 行的 SIOriginal.m」变成
    # 「编译 15 个模块 + 一个共享头文件」。顺序无关，clang 一次调用全部编掉。
    # ---------------------------------------------------------------------
    - name: Build dylib
      run: |
        set -e
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)

        # arm64 + arm64e 双架构。
        # A12+ 设备（iPhone XS 及以后）主程序默认加载 arm64e slice；
        # 注入的 dylib 若只有 arm64，TrollFools 注入后 dyld 会拒绝加载，
        # 表现为「注入成功但功能完全不生效」。
        clang -dynamiclib -O2 \
          -arch arm64 -arch arm64e \
          -isysroot "$SDK" \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework QuartzCore -framework CoreGraphics \
          -fobjc-arc \
          -I Tweak/include -I Tweak \
          -Wl,-no_fixup_chains \
          -install_name @rpath/SIOriginal.dylib \
          -o SIOriginal.dylib \
          Tweak/SIOCore.m \
          Tweak/SIOPlatform.m \
          Tweak/SIOConfig.m \
          Tweak/SIOEngine.m \
          Tweak/SIOScheduler.m \
          Tweak/SIOUI.m \
          Tweak/SIOInstaller.m \
          Tweak/SIOBackground.m \
          Tweak/hooks/SIOCoreAnimation.m \
          Tweak/hooks/SIOUIViewAnim.m \
          Tweak/hooks/SIOViewControllers.m \
          Tweak/hooks/SIOControls.m \
          Tweak/hooks/SIOCollections.m \
          Tweak/hooks/SIOScrollView.m \
          Tweak/hooks/SIOSpringBoard.m

        # 注入用 dylib 必须「不带任何 entitlement」ad-hoc 签名。
        # 旧流程 ldid -Sentitlements.plist 把 platform-application / no-sandbox /
        # persona-mgmt / AppDataContainers 等私有 entitlement 嵌进 dylib；
        # TrollFools 注入后宿主是普通第三方 App，dyld/AMFI 加载携带私有
        # entitlement 的注入库会直接 SIGKILL —— 表现为目标 App 启动即闪退。
        # `ldid -S` 不带参数 = 仅 ad-hoc 签名，不嵌入 entitlement。
        ldid -S SIOriginal.dylib
        echo "--- dylib id:"; otool -D SIOriginal.dylib
        echo "--- dylib entitlements (必须为空):"; ldid -e SIOriginal.dylib || true

        # 链接依赖断言 —— dylib 不得链接 AVFoundation/UserNotifications。
        # 这对应红线 #4：不用保活的 App，启动路径上不得出现这两个框架。
        if otool -L SIOriginal.dylib | grep -qE "AVFoundation|UserNotifications"; then
          echo "::error::dylib 不应链接 AVFoundation/UserNotifications（惰性加载）"
          otool -L SIOriginal.dylib
          exit 1
        fi
        echo "--- 无 AVFoundation/UserNotifications 链接依赖 OK"

        # FAT 结构审计：逐条目校验架构表 magic / 段覆盖自洽性。
        # lipo -info 只读架构名列表，不校验条目是否真能解析。
        echo "--- 审计脚本回归测试:"
        python3 tools/test_audit_dylib.py
        echo "--- 结构审计:"
        python3 tools/audit_dylib.py SIOriginal.dylib

    - name: Build App
      run: |
        set -e
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        APP_DIR="Payload/SIOriginal.app"
        rm -rf Payload
        mkdir -p "$APP_DIR"

        clang -O2 \
          -arch arm64 -arch arm64e \
          -isysroot "$SDK" \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework CoreGraphics -framework Foundation \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -o "$APP_DIR/SIOriginal" \
          App/main.m

        cp App/Info.plist "$APP_DIR/"
        for icon in App/assets/AppIcon.png App/Icon-60@2x.png App/Icon-60@3x.png \
                    App/Icon-76@2x.png App/Icon-83.5@2x.png; do
          [ -f "$icon" ] && cp "$icon" "$APP_DIR/"
        done
        for icon in App/assets/*.png; do
          [ -f "$icon" ] && cp "$icon" "$APP_DIR/"
        done

        # 配置 App 主程序需要私有 entitlement（写 /var/Managed Preferences、
        # posix_spawn persona 提权重启），由 TrollStore 安装时保留授权。
        # 对整个 .app 目录签名以生成 _CodeSignature/CodeResources
        # （旧流程只签二进制，IPA 内缺包签名清单）。
        codesign --force --sign - --entitlements entitlements.plist \
          --generate-entitlement-der "$APP_DIR"
        codesign -d --entitlements - "$APP_DIR/SIOriginal" || true

        # 打 IPA
        rm -f SIOriginal.ipa
        zip -qr SIOriginal.ipa Payload

    - name: Verify artifacts
      run: |
        set -e
        echo "== install_name 必须是 @rpath（TrollFools 注入要求）"
        otool -D SIOriginal.dylib | grep -q '@rpath/SIOriginal.dylib'
        echo "== dylib 必须包含 arm64 + arm64e 双架构（A12+ 兼容）"
        lipo -info SIOriginal.dylib | tee /tmp/lipo.txt
        grep -q 'arm64'  /tmp/lipo.txt
        grep -q 'arm64e' /tmp/lipo.txt
        echo "== dylib 不得内嵌 entitlement"
        if ldid -e SIOriginal.dylib 2>/dev/null | grep -q .; then
          echo "::error::dylib 内嵌了 entitlement，注入普通 App 会被 AMFI 杀死"
          exit 1
        fi
        echo "== IPA 必须包含包签名清单"
        unzip -l SIOriginal.ipa | grep -q '_CodeSignature/CodeResources'
        echo "== IPA 必须包含配置 App 主程序"
        unzip -l SIOriginal.ipa | grep -q 'Payload/SIOriginal.app/SIOriginal'
        ls -l SIOriginal.dylib SIOriginal.ipa

    # 产物上传：无论是否打 tag 都上传 artifact，便于手动下载。
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SIOriginal-v3.1.0
        path: |
          SIOriginal.dylib
          SIOriginal.ipa
        if-no-files-found: error

    # tag 推送时额外创建 Release（可直接从 Release 页面下载 IPA）。
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SIOriginal.dylib
          SIOriginal.ipa
        generate_release_notes: true
