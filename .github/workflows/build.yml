name: Build IPA & Dylib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# v1.8.19：tag 推送时创建 Release 需要 contents: write。
# 默认 GITHUB_TOKEN 只有 Contents: read，softprops/action-gh-release 会 403，
# 表现为「编译全部成功但工作流最终失败」。
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install ldid
      run: brew install ldid

    - name: Build dylib
      run: |
        set -e
        # v2.0.2：构建 arm64 + arm64e 双架构。
        # A12+ 设备（iPhone XS 及以后）主程序默认加载 arm64e slice；
        # 注入的 dylib 若只有 arm64，TrollFools 注入后 dyld 会拒绝加载，
        # 表现为「注入成功但功能完全不生效」。必须双架构。
        clang -dynamiclib -O2 \
          -arch arm64 -arch arm64e \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework QuartzCore -framework CoreGraphics -framework AVFoundation -framework UserNotifications \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -install_name @rpath/SIOriginal.dylib \
          -o SIOriginal.dylib \
          Tweak/SIOriginal.m
        # v1.8.19 关键修复：注入用 dylib 必须「不带任何 entitlement」ad-hoc 签名。
        # 旧流程 ldid -Sentitlements.plist 把 platform-application / no-sandbox /
        # persona-mgmt / AppDataContainers 等私有 entitlement 嵌进 dylib；
        # TrollFools 注入后宿主是普通第三方 App，dyld/AMFI 加载携带私有
        # entitlement 的注入库会直接 SIGKILL —— 表现为目标 App 启动即闪退。
        # `ldid -S` 不带参数 = 仅 ad-hoc 签名，不嵌入 entitlement。
        ldid -S SIOriginal.dylib
        echo "--- dylib id:"; otool -D SIOriginal.dylib
        echo "--- dylib entitlements (必须为空):"; ldid -e SIOriginal.dylib || true

        # v2.0.6 新增：构建后立即做结构审计。
        # 起因：v2.0.6 发布的产物里，FAT 头第 2 个架构条目是**畸形的** ——
        # 它声明为 x86_64，但指向的偏移处实际是 ASCII 字符串
        # （"ppOverride\0_SIO_bundleID\0"），根本不是 Mach-O 头。
        # `lipo -info` 只读 FAT 头的架构名列表，不校验每个条目是否真能解析，
        # 因此这个缺陷能一路通过 CI，直到注入器实际读 slice 时才炸。
        # 审计脚本会逐条目校验 magic / 段覆盖自洽性，并在发现畸形条目时直接失败。
        echo "--- 结构审计:"
        python3 tools/audit_dylib.py SIOriginal.dylib

    - name: Build App
      run: |
        set -e
        # 编译 .app
        APP_DIR="Payload/SIOriginal.app"
        rm -rf Payload
        mkdir -p "$APP_DIR"

        clang -O2 \
          -arch arm64 -arch arm64e \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework CoreGraphics -framework Foundation \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -o "$APP_DIR/SIOriginal" \
          App/main.m

        # 复制资源
        cp App/Info.plist "$APP_DIR/"
        for icon in App/AppIcon.png App/Icon-60@2x.png App/Icon-60@3x.png App/Icon-76@2x.png App/Icon-83.5@2x.png; do
          [ -f "$icon" ] && cp "$icon" "$APP_DIR/"
        done

        # 配置 App 主程序需要私有 entitlement（写 /var/Managed Preferences、
        # posix_spawn persona 提权重启），由 TrollStore 安装时保留授权。
        # v1.8.19：对整个 .app 目录 ad-hoc 签名，生成 _CodeSignature/CodeResources
        # （旧流程只签二进制，IPA 内缺包签名清单）。
        codesign --force --sign - --entitlements entitlements.plist \
          --generate-entitlement-der "$APP_DIR"
        codesign -d --entitlements - "$APP_DIR/SIOriginal" || true

        # 打包 IPA
        rm -f SIOriginal.ipa
        zip -qr SIOriginal.ipa Payload

    - name: Verify artifacts
      run: |
        set -e
        echo "== install_name 必须是 @rpath（TrollFools 注入要求）"
        otool -D SIOriginal.dylib | grep -q '@rpath/SIOriginal.dylib'
        echo "== dylib 必须包含 arm64 + arm64e 双架构（A12+ 兼容）"
        lipo -info SIOriginal.dylib | tee /tmp/lipo.txt
        grep -q 'arm64'  /tmp/lipo.txt
        grep -q 'arm64e' /tmp/lipo.txt
        echo "== dylib 不得内嵌 entitlement"
        if ldid -e SIOriginal.dylib 2>/dev/null | grep -q .; then
          echo "::error::dylib 内嵌了 entitlement，注入普通 App 会被 AMFI 杀死"
          exit 1
        fi
        echo "== IPA 必须包含包签名清单"
        unzip -l SIOriginal.ipa | grep -q '_CodeSignature/CodeResources'
        ls -l SIOriginal.dylib SIOriginal.ipa

    - name: Static source check
      run: |
        set -e
        # 在花时间编译之前先做静态核查：括号配平 / 原 IMP 判空 / hook 符号配对。
        # 这些是本项目历史上反复出现过的错误类别（见 README 的 v1.8.12 条目），
        # 静态阶段就能拦下，比等 clang 报错更快、报错信息也更直白。
        python3 tools/static_check.py .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SIOriginal-Build
        path: |
          SIOriginal.dylib
          SIOriginal.ipa
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SIOriginal.dylib
          SIOriginal.ipa
