name: Build IPA & Dylib (TimeMode)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 的多次构建只保留最后一次（防止旧构建覆盖新资产）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install ldid
      run: brew install ldid

    - name: Build dylib
      run: |
        set -e
        # TimeMode 变体：全部实现在单文件 Tweak/SIOriginal.m 内
        #（只重绑定 CACurrentMediaTime，无 fishhook 依赖）。
        # 双架构（arm64 + arm64e，A12+ 必需）+ -Wl,-no_fixup_chains（iOS 14 兼容）。
        clang -dynamiclib -O2 \
          -arch arm64 -arch arm64e \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework QuartzCore -framework CoreGraphics \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -install_name @rpath/SIOriginal.dylib \
          -o SIOriginal.dylib \
          Tweak/SIOriginal.m
        # 注入用 dylib 必须不带任何 entitlement，仅 ad-hoc 签名（ldid -S）。
        # 私有 entitlement 会让 AMFI 在普通 App 里 SIGKILL —— 启动即闪退。
        ldid -S SIOriginal.dylib
        echo "--- dylib id:"; otool -D SIOriginal.dylib
        echo "--- dylib entitlements (必须为空):"; ldid -e SIOriginal.dylib || true

        if otool -L SIOriginal.dylib | grep -qE "AVFoundation|UserNotifications"; then
          echo "::error::dylib 不应链接 AVFoundation/UserNotifications（v2.0.7 起惰性加载）"
          otool -L SIOriginal.dylib
          exit 1
        fi
        echo "--- 无 AVFoundation/UserNotifications 链接依赖 ✓"

        echo "--- 审计脚本回归测试:"
        python3 tools/test_audit_dylib.py
        echo "--- 结构审计:"
        python3 tools/audit_dylib.py SIOriginal.dylib

    - name: Build App
      run: |
        set -e
        APP_DIR="Payload/SIOriginal.app"
        rm -rf Payload
        mkdir -p "$APP_DIR"

        clang -O2 \
          -arch arm64 -arch arm64e \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios14.0 \
          -framework UIKit -framework CoreGraphics -framework Foundation \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -o "$APP_DIR/SIOriginal" \
          App/main.m

        cp App/Info.plist "$APP_DIR/"
        for icon in App/AppIcon.png App/Icon-60@2x.png App/Icon-60@3x.png App/Icon-76@2x.png App/Icon-83.5@2x.png; do
          [ -f "$icon" ] && cp "$icon" "$APP_DIR/"
        done

        # 配置 App 主程序需要私有 entitlement（TrollStore 安装时保留授权）；
        # 对整个 .app 目录 ad-hoc 签名生成 _CodeSignature/CodeResources。
        codesign --force --sign - --entitlements entitlements.plist \
          --generate-entitlement-der "$APP_DIR"
        codesign -d --entitlements - "$APP_DIR/SIOriginal" || true

        rm -f SIOriginal.ipa
        zip -qr SIOriginal.ipa Payload

    - name: Verify artifacts
      run: |
        set -e
        echo "== install_name 必须是 @rpath（TrollFools 注入要求）"
        otool -D SIOriginal.dylib | grep -q '@rpath/SIOriginal.dylib'
        echo "== dylib 必须包含 arm64 + arm64e 双架构（A12+ 兼容）"
        lipo -info SIOriginal.dylib | tee /tmp/lipo.txt
        grep -q 'arm64'  /tmp/lipo.txt
        grep -q 'arm64e' /tmp/lipo.txt
        echo "== dylib 不得内嵌 entitlement"
        if ldid -e SIOriginal.dylib 2>/dev/null | grep -q .; then
          echo "::error::dylib 内嵌了 entitlement，注入普通 App 会被 AMFI 杀死"
          exit 1
        fi
        echo "== IPA 必须包含包签名清单"
        unzip -l SIOriginal.ipa | grep -q '_CodeSignature/CodeResources'
        ls -l SIOriginal.dylib SIOriginal.ipa

    - name: Static source check
      run: |
        set -e
        python3 tools/static_check.py .
        python3 tools/check_v210.py Tweak/SIOriginal.m
        python3 tools/test_frame_align.py
        python3 tools/check_v250.py .
        python3 tools/bench_v250.py
        # TimeMode 变体新增：时间膨胀算法验证（基线重锚定 / 墙钟不缩放 / 单调性）
        python3 tools/test_time_dilation.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SIOriginal-Build
        path: |
          SIOriginal.dylib
          SIOriginal.ipa
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SIOriginal.dylib
          SIOriginal.ipa
