name: Runtime Behavior Test (Simulator)

# SIOriginal v2.4.0 全面运行时行为测试。
# 只在手动触发时运行（workflow_dispatch），不打 tag、不动 Release。
# 环境：GitHub Actions macos-15 + iOS Simulator（arm64-simulator slice）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Toolchain info
      run: |
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-version
        xcrun simctl list runtimes | grep iOS || true

    - name: Build dylib (simulator slice)
      run: |
        set -e
        SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
        # 与发布版同样的编译参数，仅 SDK/target 换成模拟器。
        # -Wl,-no_fixup_chains 对模拟器 slice 同样合法。
        clang -dynamiclib -O2 \
          -arch arm64 \
          -isysroot "$SDK" \
          -target arm64-apple-ios14.0-simulator \
          -framework UIKit -framework QuartzCore -framework CoreGraphics \
          -fobjc-arc \
          -Wl,-no_fixup_chains \
          -install_name @rpath/SIOriginal.dylib \
          -o SIOriginal-sim.dylib \
          Tweak/SIOriginal.m
        otool -D SIOriginal-sim.dylib
        lipo -info SIOriginal-sim.dylib

    - name: Build test host app
      run: |
        set -e
        SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
        APP="TestHost.app"
        rm -rf "$APP"; mkdir -p "$APP"
        clang -O2 \
          -arch arm64 \
          -isysroot "$SDK" \
          -target arm64-apple-ios14.0-simulator \
          -framework UIKit -framework QuartzCore -framework Foundation \
          -fobjc-arc \
          -o "$APP/TestHost" \
          Tests/RuntimeTestHost.m
        cp SIOriginal-sim.dylib "$APP/SIOriginal.dylib"
        cat > "$APP/Info.plist" <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleIdentifier</key><string>com.sioriginal.testhost</string>
          <key>CFBundleName</key><string>TestHost</string>
          <key>CFBundleExecutable</key><string>TestHost</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>2.4.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchScreen</key><dict/>
        </dict>
        </plist>
        EOF
        # 模拟器允许 ad-hoc 签名；宿主与 dylib 都无 entitlement
        codesign --force --sign - "$APP/SIOriginal.dylib"
        codesign --force --sign - "$APP"

    - name: Boot simulator
      run: |
        set -e
        RUNTIME=$(xcrun simctl list runtimes | grep iOS | tail -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/')
        echo "RUNTIME=$RUNTIME"
        DEVTYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-16
        UDID=$(xcrun simctl create SIO-RuntimeTest "$DEVTYPE" "$RUNTIME" 2>/dev/null \
            || xcrun simctl create SIO-RuntimeTest com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
        echo "UDID=$UDID" >> "$GITHUB_ENV"
        xcrun simctl boot "$UDID"
        xcrun simctl bootstatus "$UDID" -b

    - name: Install & run tests
      run: |
        set -o pipefail
        xcrun simctl install "$UDID" TestHost.app
        # --console 阻塞直到进程退出并转发 stdout/stderr；测试行在 stderr。
        # 宿主跑完自行 exit()，退出码=FAIL 数；即使非零也继续收集日志。
        xcrun simctl launch --console "$UDID" com.sioriginal.testhost 2>&1 | tee runtime.log || true
        echo "--- 兜底：日志里必须有 SUMMARY，否则视为宿主崩溃 ---"
        grep -q "TESTCASE|SUMMARY" runtime.log || { echo "::error::测试宿主未跑完（无 SUMMARY 行）"; tail -50 runtime.log; exit 1; }

    - name: Parse results & generate report
      run: |
        set -o pipefail
        python3 tools/parse_test_results.py runtime.log runtime_report.md | tee parse_status.txt
        cat runtime_report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-test-results
        path: |
          runtime.log
          runtime_report.md
        if-no-files-found: warn

    - name: Fail job if any test failed
      if: always()
      run: |
        if grep -q "^TESTCASE_RESULT_FAILS=[1-9]" parse_status.txt 2>/dev/null; then
          echo "::error::存在 FAIL 用例，详见 Summary 报告"
          exit 1
        fi
        grep -q "TESTCASE_RESULT_FAILS=" parse_status.txt || { echo "::error::解析状态缺失"; exit 1; }
        echo "全部用例通过（或仅 SKIP）"
